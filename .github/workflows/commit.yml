name: T-Beam 1W test firmware
on:
  push:
    branches: [build-tbeam-main-66c7381]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install platformio==6.2.0
      - name: Build firmware and filesystem
        run: |
          pio run -e tbeam_433_1w_aprs
          mkdir -p saved
          cp .pio/build/tbeam_433_1w_aprs/{firmware,bootloader,partitions}.bin saved/
          pio run -e tbeam_433_1w_aprs -t buildfs
      - name: Package binaries
        run: |
          mkdir -p output
          cp saved/firmware.bin output/tbeam_433_1w_aprs_firmware.bin
          python ~/.platformio/packages/tool-esptoolpy/esptool.py --chip esp32s3 merge_bin -o output/tbeam_433_1w_aprs_factory.bin --flash_mode dio --flash_size 8MB 0x0 saved/bootloader.bin 0x8000 saved/partitions.bin 0xe000 ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin 0x10000 saved/firmware.bin 0x5f0000 .pio/build/tbeam_433_1w_aprs/spiffs.bin
          sha256sum output/*.bin > output/SHA256SUMS.txt
          git rev-parse HEAD > output/BUILD_COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: fieldops-tbeam1w-main-66c7381
          path: output/
          retention-days: 30
